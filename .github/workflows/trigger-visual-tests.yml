name: Visual Test Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  visual-test:
    runs-on: ubuntu-latest
    env:
      # Optional: Make sure compare.py fails the CI job if a difference is detected
      FAIL_ON_VISUAL_DIFF: "true"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      # 1. Checkout the target application (Jungle_Safari)
      - name: Checkout Application
        uses: actions/checkout@v4

      # 2. Checkout the testing framework (Ai_visual_Testing) into a subfolder
      - name: Checkout Testing Framework
        uses: actions/checkout@v4
        with:
          repository: guptaabhishek2265/Ai_visual_Testing
          path: Ai_visual_Testing
          # If Ai_visual_Testing is private, you need a Personal Access Token (PAT)
          # token: ${{ secrets.VISUAL_TESTING_PAT }}

      # 3. Setup environments
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java (Required for Allure Report)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install Dependencies
      - name: Install Testing Dependencies
        working-directory: ./Ai_visual_Testing
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install opencv-python scikit-image numpy requests

      # 5. Run the Visual Tests (Using your SaaS engine in the GitHub Runner)
      - name: Execute Visual Tests
        working-directory: ./Ai_visual_Testing
        run: node utils/testRunner.js # Adjust this to the specific command that triggers tests directly (without starting the web server)
        # Note: Depending on your exact architecture, you may run the tests using Playwright directly:
        # npx playwright test --grep @regression

      # 6. Generate Allure Report
      - name: Generate Allure Report
        if: always()
        working-directory: ./Ai_visual_Testing
        run: npx allure generate allure-results --clean -o allure-report

      # 7. Upload Results as Artifacts (This is where you see them in GitHub!)
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: Ai_visual_Testing/allure-report/
          retention-days: 30

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: Ai_visual_Testing/screenshots/
          retention-days: 30
