name: Trigger AI Visual Tests

on:
  push:
    branches: [main]   # fires every time you push code to Jungle Safari

jobs:
  trigger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Visual Testing Engine
        run: |
          curl -X POST \
            https://api.github.com/repos/guptaabhishek2265/Ai_visual_Testing/dispatches \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.VISUAL_TESTING_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "event_type": "run-visual-tests",
              "client_payload": {
                "app_url":        "https://jungle-safari-e9on.vercel.app/login",
                "email":          "c@gmail.com",
                "password":       "${{ secrets.APP_PASSWORD }}",
                "steps_url":      "https://raw.githubusercontent.com/guptaabhishek2265/Jungle_safari/main/visual-tests/steps.txt",
                "source_repo":    "guptaabhishek2265/Jungle_safari",
                "commit_message": "${{ github.event.head_commit.message }}",
                "commit_sha":     "${{ github.sha }}"
              }
            }'
