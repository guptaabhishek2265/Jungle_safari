name: Visual Test Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  visual-test:
    runs-on: ubuntu-latest
    env:
      # The base URL of your application that Playwright will test against
      APP_URL: "https://jungle-safari-YOUR-URL.vercel.app"
      
      FAIL_ON_VISUAL_DIFF: "true"
      # AI Model key
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      
      # Map your GitHub Secrets to the variables expected by steps.txt
      ACCOUNT_PROJECT_3A243362372F_CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
      ACCOUNT_PROJECT_3A243362372F_INVENTORY_MANAGER_PASSWORD: ${{ secrets.INVENTORY_PASSWORD }}
      
      ACCOUNT_PROJECT_3A243362372F_CUSTOMER_EMAIL: "customer@example.com" 
      ACCOUNT_PROJECT_3A243362372F_INVENTORY_MANAGER_EMAIL: "inventory@example.com" 

    steps:
      - name: Checkout Application
        uses: actions/checkout@v4

      - name: Checkout Testing Framework
        uses: actions/checkout@v4
        with:
          repository: guptaabhishek2265/Ai_visual_Testing
          path: Ai_visual_Testing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Testing Dependencies
        working-directory: ./Ai_visual_Testing
        run: |
          npm ci
          npx playwright install --with-deps chromium
          pip install opencv-python scikit-image numpy requests

      - name: Execute Visual Tests
        working-directory: ./Ai_visual_Testing
        run: npm run test:all

      - name: Compare Screenshots
        if: always()
        working-directory: ./Ai_visual_Testing
        run: npm run compare

      - name: Generate Allure Report
        if: always()
        working-directory: ./Ai_visual_Testing
        run: npm run allure:generate

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: Ai_visual_Testing/allure-report/
          retention-days: 30

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: Ai_visual_Testing/screenshots/
          retention-days: 30
